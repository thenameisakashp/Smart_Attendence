<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initial Setup | Smart Attendance</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-body"><main class="login-card"><div class="brand-icon large">SA</div><div class="eyebrow">ONE-TIME INITIAL SETUP</div><h1>Create HOD account</h1><p>This setup is available only while no user accounts exist.</p>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<form method="post"><label>HOD full name<input name="display_name" maxlength="120" required autofocus></label><label>Username<input name="username" maxlength="80" autocomplete="username" required></label><label>Password (12+ characters)<input type="password" name="password" minlength="12" autocomplete="new-password" required></label><label>Confirm password<input type="password" name="confirm_password" minlength="12" autocomplete="new-password" required></label><button class="button primary full">Create HOD account</button></form><div class="login-hint">Passwords are stored as hashes. Choose a unique password and keep it private.</div></main></body></html>
