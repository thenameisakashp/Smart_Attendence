<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initial Setup | Smart Attendance</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-body"><main class="login-card"><div class="brand-icon large">SA</div><div class="eyebrow">ONE-TIME COLLEGE SETUP</div><h1>Create college workspace</h1><p>This deployment keeps one college's student, attendance, and face data separate.</p>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<form method="post"><label>College / institution name<input name="institution_name" maxlength="160" required autofocus></label><label>College code (optional)<input name="institution_code" maxlength="32" placeholder="Example: ABCIT"></label><label>HOD full name<input name="display_name" maxlength="120" required></label><label>Username<input name="username" maxlength="80" autocomplete="username" required></label><label>Password (12+ characters)<input type="password" name="password" minlength="12" autocomplete="new-password" required></label><label>Confirm password<input type="password" name="confirm_password" minlength="12" autocomplete="new-password" required></label><button class="button primary full">Create college workspace</button></form><div class="login-hint">Deploy a separate copy with a separate data folder for every college.</div></main></body></html>
