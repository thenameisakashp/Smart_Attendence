<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Smart Attendance</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-body"><main class="login-card"><div class="brand-icon large">SA</div><div class="eyebrow">SMART ATTENDANCE SYSTEM</div><h1>Admin sign in</h1><p>Sign in to manage students and attendance reports.</p>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<form method="post"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button primary full">Sign in</button></form><div class="login-hint"><b>First-run default:</b> admin / ChangeMe123!<br>Change these credentials before sharing this dashboard.</div></main></body></html>
