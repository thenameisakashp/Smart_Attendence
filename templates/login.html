<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Smart Attendance</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-body"><main class="login-card"><div class="brand-icon large">SA</div><div class="eyebrow">SMART ATTENDANCE SYSTEM</div><h1>Welcome back</h1><p>Sign in with your department account.</p>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<form method="post"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button primary full">Sign in</button></form>{% if not has_users %}<div class="login-hint">First time here? <a href="{{ url_for('setup') }}">Set up the HOD account</a>.</div>{% endif %}<div class="login-hint">Your dashboard is determined by your assigned role.</div></main></body></html>
